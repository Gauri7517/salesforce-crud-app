server.port=${PORT:8080}

# ===============================
# Forward Headers - Render
# ===============================
server.forward-headers-strategy=framework


# ===============================
# Frontend URL
# ===============================
frontend.url=https://salesforce-crud-app-hnrn.onrender.com


# ===============================
# Salesforce OAuth 2.0
# ===============================
spring.security.oauth2.client.registration.salesforce.client-id=3MVG9rZjd7MXFdLhMCcNOgvzISthBs4ArU5U8Swfwfwke1n6Y9dwbiI3rD53RZgcX_w15TOG31sp8hgtLQhEF

spring.security.oauth2.client.registration.salesforce.client-authentication-method=none

spring.security.oauth2.client.registration.salesforce.authorization-grant-type=authorization_code

spring.security.oauth2.client.registration.salesforce.redirect-uri=https://salesforce-crud-backend-iwqw.onrender.com/login/oauth2/code/salesforce

spring.security.oauth2.client.registration.salesforce.scope=api,refresh_token


# ===============================
# Salesforce OAuth Provider
# ===============================
spring.security.oauth2.client.provider.salesforce.authorization-uri=https://login.salesforce.com/services/oauth2/authorize

spring.security.oauth2.client.provider.salesforce.token-uri=https://login.salesforce.com/services/oauth2/token

spring.security.oauth2.client.provider.salesforce.user-info-uri=https://login.salesforce.com/services/oauth2/userinfo

spring.security.oauth2.client.provider.salesforce.user-name-attribute=user_id


# ===============================
# Spring Security Logging
# ===============================
logging.level.org.springframework.security=DEBUG

logging.level.org.springframework.security.oauth2=TRACE